<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wallet Demo - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .title {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe3;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 18px;
    }

    .login-button {
      width: 100%;
      border: 0;
      padding: 14px;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .demo-note {
      margin-top: 18px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="title">My Wallet</div>

    <div class="subtitle">
      Demo Wallet Login
    </div>

    <label class="label" for="account">
      Account
    </label>

    <input
      class="input"
      type="text"
      id="account"
      placeholder="Enter account"
    >

    <label class="label" for="password">
      Password
    </label>

    <input
      class="input"
      type="password"
      id="password"
      placeholder="Enter password"
    >

    <button class="login-button">
      Login
    </button>

    <div class="demo-note">
      Demo / Prototype only
    </div>

  </div>

</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://bmdhwwikftpzqbwhykt e.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = sb_publishable_oMkLe-Syr65BTmRxugKGxQ_e-pvF9W1

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  document.querySelector(".login-button").addEventListener("click", async () => {
    const email = document.getElementById("account").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("Account এবং Password দিন");
      return;
    }

    const { error } = await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      alert("Login failed: " + error.message);
      return;
    }

    alert("Login successful!");
  });
</script>
