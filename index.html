<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wallet Demo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #222;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
    }

    .status {
      background: #dff7e7;
      color: #16803c;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .info {
      color: #666;
      line-height: 1.7;
    }

    .balance {
      margin-top: 20px;
      background: #f4f7fb;
      border-radius: 14px;
      padding: 20px;
    }

    .balance-title {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .amount {
      font-size: 34px;
      font-weight: bold;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .action {
      border: 0;
      background: #f4f6f9;
      padding: 18px 10px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .action:hover {
      background: #e7ebf1;
    }

    @media (max-width: 500px) {
      .brand {
        font-size: 23px;
      }

      .amount {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="brand">My Wallet</div>
      <div class="status">ACTIVE</div>
    </div>

    <div class="card">

      <div class="name">Demo User</div>

      <div class="info">
        Phone: 01700000000<br>
        Account: DEMO-00001<br>
        Member: Active
      </div>

      <div class="balance">
        <div class="balance-title">
          AVAILABLE BALANCE
        </div>

        <div class="amount">
          ৳5,000
        </div>
      </div>

    </div>

    <div class="card">

      <div class="actions">

        <button class="action">
          Bank Transfer
        </button>

        <button class="action">
          Send Money
        </button>

        <button class="action">
          Cash Out
        </button>

        <button class="action">
          Withdraw
        </button>

        <button class="action">
          Statements
        </button>

        <button class="action">
          Deposit
        </button>

      </div>

    </div>

  </div>

</body>
</html>
